<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新标签页</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="top-panel" aria-label="固定书签">
        <div class="pinned-header">
          <div>
            <p class="eyebrow">固定书签</p>
            <h1>书签</h1>
          </div>
          <label class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="搜索书签">
          </label>
        </div>
        <div id="pinnedBar" class="pinned-bar" aria-live="polite"></div>
      </section>

      <section class="content-shell">
        <aside class="sidebar-panel" aria-label="书签文件夹">
          <div class="panel-title">文件夹</div>
          <nav id="sidebar" class="folder-tree"></nav>
        </aside>

        <section class="bookmark-panel" aria-label="书签">
          <header class="bookmark-panel-header">
            <div>
              <p id="viewModeLabel" class="eyebrow">文件夹</p>
              <h2 id="contentTitle">书签</h2>
            </div>
            <p id="resultCount" class="result-count"></p>
          </header>
          <div id="bookmarkGrid" class="bookmark-grid"></div>
        </section>
      </section>
    </main>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
