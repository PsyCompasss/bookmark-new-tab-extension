<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookmark Dashboard</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="top-panel" aria-label="Pinned bookmarks" data-i18n-aria-label="pinnedBookmarksAriaLabel">
        <div class="pinned-header">
          <div>
            <p class="eyebrow" data-i18n="pinnedBookmarksEyebrow">Pinned bookmarks</p>
            <h1 data-i18n="appTitle">Bookmarks</h1>
          </div>
          <label class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="Search bookmarks" data-i18n-placeholder="searchPlaceholder" aria-label="Search bookmarks" data-i18n-aria-label="searchAriaLabel">
          </label>
        </div>
        <div id="pinnedBar" class="pinned-bar" aria-live="polite"></div>
      </section>

      <section class="content-shell">
        <aside class="sidebar-panel" aria-label="Bookmark folders" data-i18n-aria-label="foldersAriaLabel">
          <div class="panel-title" data-i18n="foldersTitle">Folders</div>
          <nav id="sidebar" class="folder-tree"></nav>
        </aside>

        <section class="bookmark-panel" aria-label="Bookmarks" data-i18n-aria-label="bookmarksAriaLabel">
          <header class="bookmark-panel-header">
            <div>
              <p id="viewModeLabel" class="eyebrow" data-i18n="folderEyebrow">Folder</p>
              <h2 id="contentTitle" data-i18n="appTitle">Bookmarks</h2>
            </div>
            <div class="result-meta">
              <p id="resultCount" class="result-count"></p>
              <p id="reorderHint" class="reorder-hint" data-i18n="reorderHint">Drag to change the order in Chrome bookmarks</p>
            </div>
          </header>
          <div id="bookmarkGrid" class="bookmark-grid"></div>
        </section>
      </section>
    </main>

    <script type="module" src="newtab.js"></script>
  </body>
</html>
